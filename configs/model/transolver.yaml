# The cfd_transformer Transolver: identical to that repo's config/model/transformer.yaml,
# pinned here so the benchmark does not depend on it staying unchanged.
model:
  _target_: model.transformer.Transformer
  space_dim: 6
  n_layers: 5
  n_hidden: 256
  dropout: 0.2
  n_head: 8
  act: "gelu"
  mlp_ratio: 1
  slice_num: 32
muon_exclude: [preprocess.linear_pre, mlp_out.2]   # input embedding and output head
