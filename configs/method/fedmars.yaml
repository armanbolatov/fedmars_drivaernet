# FedMARS-M: FedMuon + MARS variance reduction on the matrix params. Tuned by its
# own search at the reference gamma = 0.01; gamma itself is an ablation variable
# (benchmark carries {0, 0.01, 0.04}).
method: fedmars
args:
  methods: fedmuon
  mars-gamma: 0.01
  muon-lr: 3.0e-3       # tuned (24-config search, interior)
  scalar-lr: 1.0e-5     # tuned
  fed-beta: 0.9         # tuned (24-config search, interior)
  cv-rule: mean
  muon-scale: shape
  muon-scale-const: 0.2
  muon-lr-decay: cosine
  muon-wd: 0.1

# per_split: the per-distribution muon-lr, from the evaluation-scale ladder
# (tune_full.py); all other values transfer from the reference split.
