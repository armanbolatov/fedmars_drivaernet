# Centralized MARS-M ceiling: centralized_muon + MARS variance reduction (single
# client, so this is plain MARS-M on all data: matrix params take the Muon LMO step
# with MARS-corrected momentum). Inherits centralized_muon's tuned LRs/beta;
# gamma = the reference-split winner (0.01).
method: centralized_mars
args:
  methods: fedmuon
  num-clients: 1
  client-split-mode: dirichlet
  alphas: 1000000
  mars-gamma: 0.01
  muon-lr: 1.0e-3
  scalar-lr: 3.0e-6
  fed-beta: 0.95
  cv-rule: mean
  muon-scale: shape
  muon-scale-const: 0.2
  muon-exclude: preprocess.linear_pre,mlp_out.2
  muon-lr-decay: cosine
  muon-wd: 0.1

# no per_split: always holds all data, one config for every split
