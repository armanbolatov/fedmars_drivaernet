# FedMuon: Muon (orthogonalized LMO) on matrix params + AdamW on the rest,
# SCAFFOLD-style control variates with the mean rule. Two LRs by construction.
method: fedmuon
args:
  methods: fedmuon
  mars-gamma: 0
  muon-lr: 3.0e-3       # tuned (24-config search, interior)
  scalar-lr: 3.0e-5     # tuned
  fed-beta: 0.9         # tuned (24-config search, interior)
  cv-rule: mean
  muon-scale: shape
  muon-scale-const: 0.2
  muon-exclude: preprocess.linear_pre,mlp_out.2
  muon-lr-decay: cosine
  muon-wd: 0.1

# per_split: the per-distribution muon-lr, from the evaluation-scale ladder
# (tune_full.py); all other values transfer from the reference split.
