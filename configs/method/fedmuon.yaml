# FedMuon: Muon (orthogonalized LMO) on matrix params + AdamW on the rest,
# SCAFFOLD-style control variates with the mean rule. Two LRs by construction.
method: fedmuon
args:
  methods: fedmuon
  mars-gamma: 0
  muon-lr: 3.0e-3       # tuned (interior; 1e-3 and 1e-2 both worse)
  scalar-lr: 1.0e-5     # tuned
  fed-beta: 0.8         # tuned (0.7 and 0.9 both worse)
  cv-rule: mean
  muon-scale: shape
  muon-scale-const: 0.2
  muon-exclude: preprocess.linear_pre,mlp_out.2
  muon-lr-decay: cosine
  muon-wd: 0.1

# per-distribution overrides (benchmark.py applies the block matching the split);
# tuned independently per alpha. Local-steps ablation reuses these values as-is.
per_split:
  dirichlet_0.5:
    muon-lr: 3.0e-3
    scalar-lr: 1.0e-5
    fed-beta: 0.8
  dirichlet_10:
    muon-lr: 3.0e-3
    scalar-lr: 1.0e-5
    fed-beta: 0.8
  dirichlet_1000:
    muon-lr: 3.0e-3
    scalar-lr: 3.0e-5
    fed-beta: 0.9
